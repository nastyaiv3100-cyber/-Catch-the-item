<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Поймай предмет</title>
<style>
/* --- СТИЛИ ИГРЫ (Оставлены без изменений для краткости) --- */
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; background: #0a0e27; font-family: 'Arial', sans-serif; overflow: hidden; }
#game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; width: 100%; padding: 50px 30px; z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.progress-container { flex: 1; max-width: 600px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.8); border-radius: 10px; overflow: hidden; margin: 0 auto; pointer-events: auto; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #9b59b6, #8e44ad); width: 0%; transition: width 0.5s ease; }
#question-box { background: #111111; border: 2px solid #a29bfe; color: #fff; border-radius: 18px; padding: 18px 24px; text-align: center; max-width: 820px; margin: 10px auto; pointer-events: auto; }
#lives-bar { position: absolute; top: 80px; right: 20px; display: flex; gap: 10px; pointer-events: none; }
.heart { width: 40px; height: 40px; background-size: contain; background-repeat: no-repeat; display: inline-block; }
#hero { position: absolute; bottom: 30px; width: 150px; height: 150px; background-repeat: no-repeat; background-position: center; background-size: contain; z-index: 5; }
.falling-item { position: absolute; top: -100px; display: flex; justify-content: center; align-items: center; background-size: contain; background-repeat: no-repeat; z-index: 4; width: 70px; height: 70px; }
.item-label { background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: 700; white-space: nowrap; border: 1px solid rgba(255,255,255,0.5); }
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 20; }
.overlay.hidden { display: none; }
.modal { background: #1a1a1a; border: 3px solid #a29bfe; padding: 40px; border-radius: 20px; text-align: center; color: #fff; max-width: 90%; }
.game-btn { background: #a29bfe; padding: 10px 30px; border-radius: 50px; color: #fff; font-weight: 800; cursor: pointer; margin-top: 20px; display: inline-block; border: 2px solid #fff; }
#mobile-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 20px; z-index: 15; }
@media (max-width: 768px) { #mobile-controls { display: flex; } }
.mobile-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(108,92,231,0.8); border: 3px solid #fff; color: #fff; font-size: 30px; display:flex; align-items:center; justify-content:center;}
</style>
</head>
<body>

<div id="game-container">
  <div id="ui">
    <div class="progress-container"><div id="progress-fill" class="progress-fill"></div></div>
    <div id="lives-bar"></div>
    <div id="question-box"><div id="question-text">Загрузка...</div></div>
  </div>
  <div id="hero"></div>
  <div id="mobile-controls">
    <div class="mobile-btn" id="btn-left">←</div>
    <div class="mobile-btn" id="btn-right">→</div>
  </div>
  <div id="overlay" class="overlay">
    <div class="modal">
      <h1 id="overlay-title">Загрузка</h1>
      <p id="overlay-desc">Пожалуйста, подождите...</p>
      <div id="overlay-btn" class="game-btn" style="display:none">OK</div>
    </div>
  </div>
</div>

<script>
(function() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  // Глобальный конфиг (будет заполнен после fetch)
  let CONFIG = {
    heroImg: "", bombImg: "", lifeImg: "", skinImg1: "", skinImg2: "",
    heroSpeed: 6, fallSpeed: 2, spawnInterval: 900, maxLives: 3,
    questions: [],
    probabilities: { bomb: 0.15, correct: 0.5, wrong: 0.35 },
    texts: { title: "Game", desc: "", btn: "Play" } // Тексты
  };

  let state = {
    running: 0, paused: 0, questionIndex: 0, lives: 3,
    heroX: 0, heroFlip: 0, activeObjects: [],
    lastTime: 0, spawnTimer: 0, animationFrame: 0,
    keys: { left: 0, right: 0 }, bonusProgress: 0
  };

  const DOM = {
    container: document.getElementById('game-container'),
    hero: document.getElementById('hero'),
    livesBar: document.getElementById('lives-bar'),
    questionText: document.getElementById('question-text'),
    progressFill: document.getElementById('progress-fill'),
    overlay: document.getElementById('overlay'),
    overlayTitle: document.getElementById('overlay-title'),
    overlayDesc: document.getElementById('overlay-desc'),
    overlayBtn: document.getElementById('overlay-btn')
  };

  // === НОВАЯ ФУНКЦИЯ ИНИЦИАЛИЗАЦИИ ===
  async function initGame() {
      // 1. Получаем ID из адреса
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
          showError("Ошибка: ID игры не указан в ссылке (?id=...)");
          return;
      }

      try {
          // 2. Скачиваем JSON (используем обратные кавычки)
          const response = await fetch(`https://nastyaiv3100-cyber.github.io/texts/data/${id}.json`);
          
          if (!response.ok) throw new Error("Конфиг не найден");
          
          const data = await response.json();

          // 3. Применяем настройки из JSON
          CONFIG.heroImg = data.h;
          CONFIG.bombImg = data.b;
          CONFIG.lifeImg = data.l;
          CONFIG.skinImg1 = data.i1;
          CONFIG.skinImg2 = data.i2;
          
          CONFIG.heroSpeed = Number(data.sp) * 2; // Чуть быстрее для героя
          CONFIG.fallSpeed = Number(data.sp);
          CONFIG.spawnInterval = Number(data.fr);
          CONFIG.maxLives = Number(data.lives);
          CONFIG.questions = data.qs;
          
          // Вероятности
          const pBomb = Number(data.probBomb) / 100;
          const pLife = Number(data.probLife) / 100;
          const pScore = Number(data.probScore) / 100;
          CONFIG.probabilities = {
              bomb: pBomb,
              life: pLife,
              score: pScore,
              correct: 0.4, // Остальное
              wrong: 0.3
          };

          // Тексты из конфига
          CONFIG.texts = {
              title: data.tt || "Поймай предмет",
              desc: data.td || "",
              win: data.tw || "Победа!",
              lose: data.tl || "Поражение",
              btnStart: data.btnStart || "ИГРАТЬ",
              btnRetry: data.btnRetry || "ЕЩЁ РАЗ"
          };
          
          // Применяем стили (цвета) динамически
          document.body.style.setProperty('--c', data.bc); 
          document.body.style.fontFamily = data.fn;
          
          // Запуск
          DOM.hero.style.backgroundImage = `url("${CONFIG.heroImg}")`;
          setupEvents();
          resetHeroPosition();
          updateLives(1);
          showOverlay(0); // Меню старта
          DOM.overlayBtn.style.display = 'inline-block';

      } catch (e) {
          showError("Не удалось загрузить игру: " + e.message);
      }
  }

  function showError(msg) {
      DOM.overlayTitle.innerText = "Ошибка";
      DOM.overlayDesc.innerText = msg;
      DOM.overlayBtn.style.display = 'none';
  }

  // --- ЛОГИКА ИГРЫ (Упрощена для примера, но функциональна) ---

  function showOverlay(mode) {
    DOM.overlay.classList.remove('hidden');
    if (mode === 0) {
      setOverlayText(CONFIG.texts.title, CONFIG.texts.desc, CONFIG.texts.btnStart, startGame);
    } else if (mode === 2) {
      setOverlayText(CONFIG.texts.lose, "", CONFIG.texts.btnRetry, startGame); 
    } else if (mode === 3) {
      setOverlayText(CONFIG.texts.win, "", CONFIG.texts.btnRetry, startGame); 
    }
  }

  function setOverlayText(title, desc, btnText, btnFunc) {
    DOM.overlayTitle.innerText = title; DOM.overlayDesc.innerText = desc; DOM.overlayBtn.innerText = btnText;
    DOM.overlayBtn.onclick = () => { if (audioCtx.state === 'suspended') audioCtx.resume(); btnFunc(); };
  }

  function startGame() {
    state.lives = CONFIG.maxLives; state.questionIndex = 0; state.activeObjects.forEach(o => o.el.remove()); state.activeObjects = [];
    state.running = 1; state.lastTime = performance.now();
    updateLives(1); loadQuestion(0); DOM.overlay.classList.add('hidden');
    requestAnimationFrame(gameLoop);
    clearInterval(state.spawnTimer); state.spawnTimer = setInterval(spawnObject, CONFIG.spawnInterval);
  }

  function loadQuestion(index) {
    if (index >= CONFIG.questions.length) { winGame(); return; }
    DOM.questionText.textContent = CONFIG.questions[index].text;
  }

  function gameLoop(time) {
    if (!state.running) return;
    const dt = (time - state.lastTime) / 16; state.lastTime = time;
    
    // Герой
    const sp = CONFIG.heroSpeed * dt;
    if (state.keys.left) { state.heroX -= sp; state.heroFlip = 1; }
    if (state.keys.right) { state.heroX += sp; state.heroFlip = 0; }
    state.heroX = Math.max(0, Math.min(DOM.container.offsetWidth - 150, state.heroX));
    DOM.hero.style.left = state.heroX + "px";
    DOM.hero.style.transform = `scaleX(${state.heroFlip ? -1 : 1})`;

    // Объекты
    const hRect = DOM.hero.getBoundingClientRect();
    const hitBox = { l: hRect.left+20, r: hRect.right-20, t: hRect.top+20, b: hRect.bottom };
    
    for (let i = state.activeObjects.length - 1; i >= 0; i--) {
        let o = state.activeObjects[i];
        o.y += o.speed * dt; o.el.style.top = o.y + "px";
        
        // Попадание
        let oRect = o.el.getBoundingClientRect();
        if (oRect.bottom > hitBox.t && oRect.top < hitBox.b && oRect.right > hitBox.l && oRect.left < hitBox.r) {
             handleHit(o, i); continue;
        }
        if (o.y > window.innerHeight) { o.el.remove(); state.activeObjects.splice(i,1); }
    }
    requestAnimationFrame(gameLoop);
  }

  function spawnObject() {
      if (!state.running) return;
      if (state.questionIndex >= CONFIG.questions.length) return;
      const q = CONFIG.questions[state.questionIndex];
      const r = Math.random();
      let type, text, isCorrect = false;

      if (r < CONFIG.probabilities.bomb) { type='bomb'; }
      else if (r < CONFIG.probabilities.bomb + 0.4) { type='ans'; isCorrect=true; text=q.correct[0]; } // Упрощено
      else { type='ans'; isCorrect=false; text=q.wrong[0]; }

      const el = document.createElement('div'); el.className = 'falling-item';
      if (type === 'bomb') el.style.backgroundImage = `url("${CONFIG.bombImg}")`;
      else {
          el.style.backgroundImage = `url("${CONFIG.skinImg1}")`;
          el.innerHTML = `<div class="item-label">${text}</div>`;
      }
      
      el.style.left = Math.random() * (window.innerWidth - 80) + "px";
      DOM.container.appendChild(el);
      state.activeObjects.push({ el: el, x: 0, y: -100, speed: CONFIG.fallSpeed + Math.random(), type: type, isCorrect: isCorrect });
  }

  function handleHit(o, i) {
      o.el.remove(); state.activeObjects.splice(i, 1);
      if (o.type === 'bomb') { state.lives--; updateLives(); }
      else if (o.type === 'ans') {
          if (o.isCorrect) { state.questionIndex++; loadQuestion(state.questionIndex); }
          else { state.lives--; updateLives(); }
      }
      if (state.lives <= 0) showOverlay(2);
  }

  function updateLives(reset) {
      DOM.livesBar.innerHTML = '';
      for(let i=0; i<state.lives; i++) {
          let d = document.createElement('div'); d.className='heart'; d.style.backgroundImage=`url("${CONFIG.lifeImg}")`;
          DOM.livesBar.appendChild(d);
      }
      let p = (state.questionIndex / CONFIG.questions.length) * 100;
      DOM.progressFill.style.width = p + "%";
  }

  function winGame() { state.running = 0; showOverlay(3); }
  function resetHeroPosition() { state.heroX = window.innerWidth/2 - 75; }
  
  function setupEvents() {
      window.onkeydown = e => { if(e.key==='ArrowLeft') state.keys.left=1; if(e.key==='ArrowRight') state.keys.right=1; };
      window.onkeyup = e => { if(e.key==='ArrowLeft') state.keys.left=0; if(e.key==='ArrowRight') state.keys.right=0; };
      document.getElementById('btn-left').ontouchstart = (e) => { e.preventDefault(); state.keys.left=1; };
      document.getElementById('btn-left').ontouchend = (e) => { e.preventDefault(); state.keys.left=0; };
      document.getElementById('btn-right').ontouchstart = (e) => { e.preventDefault(); state.keys.right=1; };
      document.getElementById('btn-right').ontouchend = (e) => { e.preventDefault(); state.keys.right=0; };
  }

  // ЗАПУСК
  initGame();

})();
</script>
</body>
</html>
